name: Windows RDP via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP User
      run: |
        net user kamel007 kamel007 /add
        net localgroup administrators kamel007 /add

    - name: Download cloudflared
      run: |
        Invoke-WebRequest `
          -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
          -OutFile cloudflared.exe

    - name: Start Cloudflare Tunnel
      env:
        CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.cloudflared.exe service install eyJhIjoiYWIzOTUwOTUwZWNkY2ExOTRiYzcyYWRiZTYyOTdlZDUiLCJ0IjoiYjJkNDY0YzUtNTY3OC00NWRiLWI4NjItYTU1MDgyNzViMzAyIiwicyI6IllXUmtPRFJoTXpjdE9XTm1PQzAwTmpZM0xUaGtaRE10T1RZeFlUTTRaVGd3WWpkaiJ9 }}
      run: |
        Start-Process -NoNewWindow -FilePath ".\cloudflared.exe" `
          -ArgumentList "tunnel run" `
          -RedirectStandardOutput tunnel.log

    - name: Show RDP Info
      run: |
        Write-Output "================================"
        Write-Output "RDP USER: kamel007"
        Write-Output "RDP PASS: kamel007"
        Write-Output "PORT: 3389"
        Write-Output "Use your Cloudflare TCP hostname"
        Write-Output "================================"

        while ($true) { Start-Sleep -Seconds 300 }
